appId: io.chayuan.game
productName: Chayuan Arena
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
  - "!**/node_modules/**" # 主进程纯 Node 内建（gateway/store 零 npm 依赖），renderer 由 vite 全量打进 dist——asar 不装 node_modules
asar: true
mac:
  target:
    - { target: dmg, arch: [arm64, x64] }
  category: public.app-category.games
  identity: null
win:
  target: [{ target: nsis, arch: [x64] }]
linux:
  target:
    - { target: deb, arch: [x64, arm64] }
    - { target: AppImage, arch: [x64] }
  category: Game
  maintainer: chayuan
