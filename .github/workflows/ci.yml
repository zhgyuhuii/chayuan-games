name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  dist:
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-14, args: "--mac" }
          - { os: windows-2022, args: "--win" }
          - { os: ubuntu-latest, args: "--linux" }
          - { os: ubuntu-24.04-arm, args: "--linux" }
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with: { name: dist-${{ matrix.os }}, path: release/*.* }
